<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apron Chat Protocol: specification</title>
<meta name="description" content="Apron Chat Protocol: Specification for self-hosted group chats">
<link rel="icon" href="/apron-logo.svg" type="image/svg+xml">
<link rel="alternate" type="text/markdown" href="/protocol.md" title="Apron Chat Protocol specification">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="/site.css">
</head>
<body class="spec">

<header class="top">
<nav aria-label="Primary">
<a href="/">home</a>
<a href="/#demo">demo</a>
<a href="/#servers">servers</a>
<a href="/#clients">clients</a>
<a class="strong" href="https://github.com/shazow/apron">github</a>
</nav>
</header>

<div class="crumbs" aria-label="Where you are">
<div class="wrap">
<span class="tier-pill"></span>
<details>
<summary><span class="where">Contents</span></summary>
<nav class="panel" aria-label="Contents">
{{toc}}
</nav>
</details>
<a class="top" href="#">↑ top</a>
<div class="meter" aria-hidden="true"></div>
</div>
</div>

<main class="wrap doc">
<article class="prose">
<p class="source">Rendered from <a href="{{source_url}}">shazow/apron@{{source}}</a> · <a href="/protocol.md">Markdown</a></p>
{{head}}
<nav class="contents" id="contents" aria-labelledby="contents-title">
<p id="contents-title" class="contents-title">Table of Contents</p>
{{map}}
{{toc}}
</nav>
{{content}}
</article>
</main>

<footer>
<div class="wrap">
<span>Apron Chat Protocol · CC0-licensed protocol, MIT-licensed implementations</span>
<span><a href="/">apron.chat</a> · <a href="/llms.txt">llms.txt</a> · <a href="https://github.com/shazow/apron">shazow/apron</a> · <a href="https://github.com/apron-chat">apron-chat</a></span>
</div>
</footer>

<script>
// Once the contents at the top scroll away, a bar shows where you are, which
// tier of the spec that is, and how far through the page, and opens the
// contents again as a dropdown. The optional capabilities start folded, and
// open when a link leads into one. Without this script, the contents at the
// top and the "↑ contents" links still work, and nothing is folded.
(() => {
  const root = document.documentElement;
  const bar = document.querySelector(".crumbs");
  const details = bar.querySelector("details");
  const where = bar.querySelector(".where");
  const pill = bar.querySelector(".tier-pill");
  const meter = bar.querySelector(".meter");
  const links = new Map([...bar.querySelectorAll('.panel a[href^="#"]')].map(a => [a.hash.slice(1), a]));
  const headings = [...document.querySelectorAll(".prose h2[id], .prose h3[id], .prose h4[id]")].filter(h => links.has(h.id));
  const label = heading => links.get(heading.id).textContent;
  const tiers = [...document.querySelectorAll(".prose .tier")];
  const folds = [...document.querySelectorAll(".prose details.fold")];

  // The latest entry: a jump down the page, such as to a link into a fold,
  // can queue one from before it too.
  new IntersectionObserver(entries => {
    const entry = entries.at(-1);
    const past = !entry.isIntersecting && entry.boundingClientRect.top < 0;
    bar.classList.toggle("shown", past);
    if (!past) details.open = false;
  }).observe(document.querySelector(".contents"));

  let shown;
  function update() {
    let section = null, current = null;
    for (const heading of headings) {
      // Folded away. A closed fold may hide its contents without taking them
      // out of the layout, so they still have a place on the page.
      if (!heading.getClientRects().length || heading.closest("details:not([open]) > :not(summary)")) continue;
      if (heading.getBoundingClientRect().top > 80) break;
      if (heading.tagName === "H2") section = heading;
      current = heading;
    }
    mark.style.left = `${(100 * Math.min(1, Math.max(0, (scrollY + 80 - span[0]) / (span[1] - span[0])))).toFixed(2)}%`;
    if (current === shown) return;
    shown = current;
    const tier = current?.closest(".tier");
    if (tier) root.dataset.tier = tier.dataset.tier; else delete root.dataset.tier;
    pill.textContent = tier ? tier.querySelector(".tier-tab b").textContent : "";
    meter.querySelectorAll("span").forEach((segment, i) => segment.classList.toggle("on", tiers[i] === tier));
    bar.querySelectorAll("[aria-current]").forEach(a => a.removeAttribute("aria-current"));
    if (!current) return void (where.textContent = "Contents");
    where.textContent = section && section !== current ? `${label(section)} / ${label(current)}` : label(current);
    links.get(current.id).setAttribute("aria-current", "location");
  }

  // The meter: the page from the first section to the end, a segment for each
  // tier, and a mark where you are. Measured again when folds open or close.
  let span = [0, 1];
  const mark = document.createElement("i");
  function measure() {
    const top = tiers[0].getBoundingClientRect().top + scrollY;
    const bottom = tiers.at(-1).getBoundingClientRect().bottom + scrollY;
    span = [top, bottom];
    meter.replaceChildren(...tiers.map(tier => {
      const segment = document.createElement("span");
      segment.dataset.tier = tier.dataset.tier;
      segment.style.width = `${(100 * tier.offsetHeight / (bottom - top)).toFixed(2)}%`;
      return segment;
    }), mark);
    shown = undefined;
    update();
  }

  // Fold the capabilities, except one a link leads into. A link or find in
  // page into a closed one opens it.
  const reveal = id => {
    const fold = id && document.getElementById(decodeURIComponent(id))?.closest("details.fold");
    if (fold) fold.open = true;
  };
  for (const fold of folds) fold.open = false;
  reveal(location.hash.slice(1));
  document.addEventListener("click", event => {
    const a = event.target.closest('a[href^="#"]');
    if (a) reveal(a.hash.slice(1));
  }, true);
  addEventListener("hashchange", () => reveal(location.hash.slice(1)));
  for (const fold of folds) fold.addEventListener("toggle", measure);
  if (folds.length) {
    const all = document.createElement("p");
    all.className = "fold-all";
    all.innerHTML = '<button type="button" data-open="true">Open all capabilities</button><button type="button">Close all</button>';
    all.addEventListener("click", event => {
      const button = event.target.closest("button");
      if (button) for (const fold of folds) fold.open = !!button.dataset.open;
    });
    folds[0].before(all);
  }

  let queued = false;
  addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; update(); });
  }, { passive: true });
  addEventListener("resize", measure);
  measure();

  // Close the dropdown after choosing a section, on Escape, or on a click elsewhere.
  bar.addEventListener("click", event => { if (event.target.closest(".panel a")) details.open = false; });
  addEventListener("keydown", event => { if (event.key === "Escape") details.open = false; });
  addEventListener("click", event => { if (!bar.contains(event.target)) details.open = false; });
})();
</script>

</body>
</html>
