<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apron Chat Protocol: specification</title>
<meta name="description" content="The Apron Chat Protocol specification, version {{version}}.">
<link rel="icon" href="/apron-logo.svg" type="image/svg+xml">
<link rel="alternate" type="text/markdown" href="/protocol.md" title="Apron Chat Protocol specification">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<link rel="stylesheet" href="/site.css">
</head>
<body>

<header class="top">
<nav aria-label="Primary">
<a href="/">home</a>
<a href="/#demo">demo</a>
<a href="/#servers">servers</a>
<a href="/#clients">clients</a>
<a class="strong" href="https://github.com/shazow/apron">github</a>
</nav>
</header>

<main class="wrap doc">

<nav class="toc" aria-label="Contents">
<details open>
<summary>Contents</summary>
{{toc}}
</details>
<a class="top" href="#">↑ top</a>
</nav>
<script>
// On narrow screens the contents sit above the spec, so start them folded.
if (matchMedia("(max-width: 899px)").matches) document.querySelector(".toc details").open = false;
</script>

<article class="prose">
<p class="source">Rendered from <a href="{{source_url}}">shazow/apron@{{source}}</a> · <a href="/protocol.md">Markdown</a></p>
{{content}}
</article>

</main>

<footer>
<div class="wrap">
<span>Apron Chat Protocol · v{{version}} · MIT</span>
<span><a href="/">apron.chat</a> · <a href="/llms.txt">llms.txt</a> · <a href="https://github.com/shazow/apron">shazow/apron</a> · <a href="https://github.com/apron-chat">apron-chat</a></span>
</div>
</footer>

<script>
// The contents show the top-level sections. Mark the one being read: its
// subsections unfold, and the current subsection is highlighted.
(() => {
  const toc = document.querySelector(".toc");
  const links = new Map([...toc.querySelectorAll('a[href^="#"]')].map(a => [a.hash.slice(1), a]));
  const headings = [...document.querySelectorAll(".prose h2[id], .prose h3[id]")].filter(h => links.has(h.id));
  let shown = null;
  function update() {
    let section = null, subsection = null;
    for (const heading of headings) {
      if (heading.getBoundingClientRect().top > 96) break;
      if (heading.tagName === "H2") [section, subsection] = [heading, null];
      else subsection = heading;
    }
    const current = subsection ?? section;
    if (current === shown) return;
    shown = current;
    toc.querySelectorAll("li.open").forEach(li => li.classList.remove("open"));
    toc.querySelectorAll("[aria-current]").forEach(a => a.removeAttribute("aria-current"));
    if (section) links.get(section.id).parentElement.classList.add("open");
    if (current) links.get(current.id).setAttribute("aria-current", "location");
  }
  let queued = false;
  addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; update(); });
  }, { passive: true });
  update();
})();
</script>

</body>
</html>
